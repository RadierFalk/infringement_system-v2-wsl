<div class="login-wrapper">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Infringement System</mat-card-title>
      <mat-card-subtitle>Entrar na sua conta</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Usuário</mat-label>
          <input matInput formControlName="username" autocomplete="username" />
          <mat-error *ngIf="form.controls.username.invalid">Informe o usuário</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Senha</mat-label>
          <input
            matInput
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password"
            autocomplete="current-password"
          />
          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="hidePassword = !hidePassword"
            [attr.aria-label]="'Mostrar senha'"
          >
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="form.controls.password.invalid">Informe a senha</mat-error>
        </mat-form-field>

        <p class="error-message" *ngIf="error$ | async as error">{{ error }}</p>

        <div class="submit-row">
          <button
            mat-raised-button
            color="primary"
            type="submit"
            class="full-width"
            [disabled]="(loading$ | async) ?? false"
          >
            <mat-spinner *ngIf="loading$ | async" diameter="20"></mat-spinner>
            <span *ngIf="!(loading$ | async)">Entrar</span>
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
