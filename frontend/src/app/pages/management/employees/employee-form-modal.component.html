<app-modal (closeRequested)="closed.emit()">
  <h3 class="form-title">{{ isEditMode ? 'Editar funcionário' : 'Novo funcionário' }}</h3>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="field">
      <label for="name">Nome</label>
      <input id="name" type="text" formControlName="name" />
    </div>

    <div class="field">
      <label for="username">Usuário</label>
      <input id="username" type="text" formControlName="username" />
    </div>

    <div class="field">
      <label for="email">E-mail</label>
      <input id="email" type="email" formControlName="email" />
    </div>

    <div class="field-row">
      <div class="field">
        <label for="company">Empresa</label>
        <input id="company" type="text" formControlName="company" />
      </div>

      <div class="field">
        <label for="role">Cargo</label>
        <input id="role" type="text" formControlName="role" />
      </div>
    </div>

    <div class="field">
      <label for="department_id">Departamento</label>
      <select id="department_id" formControlName="department_id">
        <option [ngValue]="null" disabled>Selecione um departamento</option>
        <option *ngFor="let dept of departments" [ngValue]="dept.id">{{ dept.name }}</option>
      </select>
    </div>

    <div class="field">
      <label for="password">
        Senha
        <span *ngIf="isEditMode" class="hint">(deixe em branco para manter a atual)</span>
      </label>
      <input id="password" type="password" formControlName="password" />
    </div>

    <div class="field">
      <label for="user_type">Papel</label>
      <select id="user_type" formControlName="user_type">
        <option value="super_admin" *ngIf="canAssignSuperAdmin">Super Administrador</option>
        <option value="admin">Administrador</option>
        <option value="normal">Funcionário</option>
      </select>
    </div>

    <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>

    <div class="form-actions">
      <button type="button" class="btn-secondary" (click)="closed.emit()">Cancelar</button>
      <button type="submit" class="btn-primary" [disabled]="isSaving">
        {{ isSaving ? 'Salvando...' : 'Salvar' }}
      </button>
    </div>
  </form>
</app-modal>
