<div class="occurrence-add-page">

  <header class="page-header">
    <div>
      <h1>Add Occurrence</h1>
      <p>Cadastrar uma nova ocorrência.</p>
    </div>

    <a class="back-button" routerLink="/management/occurrences">← Voltar</a>
  </header>

  <section class="form-card">

    <div *ngIf="loadingOptions" class="state-message">
      Carregando funcionários e categorias...
    </div>

    <div *ngIf="error" class="state-message error">
      {{ error }}
    </div>

    <div *ngIf="success" class="state-message success">
      Ocorrência cadastrada com sucesso!
    </div>

    <form
      *ngIf="!loadingOptions"
      (ngSubmit)="submit()"
    >

      <div class="form-group">
        <label for="title">Title *</label>

        <input
          id="title"
          name="title"
          type="text"
          [(ngModel)]="form.title"
          required
        />
      </div>

      <div class="form-group">
        <label for="description">Description</label>

        <textarea
          id="description"
          name="description"
          rows="5"
          [(ngModel)]="form.description"
        ></textarea>
      </div>

      <div class="form-group">
        <label for="date">Date *</label>

        <input
          id="date"
          name="date"
          type="datetime-local"
          [(ngModel)]="form.date"
          required
        />
      </div>

      <div class="form-group">
        <label for="employee">Employee *</label>

        <select
          id="employee"
          name="employee"
          [(ngModel)]="form.employee_id"
          required
        >
          <option [ngValue]="0">
            Select an employee
          </option>

          <option
            *ngFor="let employee of employees"
            [ngValue]="employee.id"
          >
            {{ employee.name }}
          </option>
        </select>
      </div>

      <div class="form-group">
        <label for="category">Category</label>

        <select
          id="category"
          name="category"
          [(ngModel)]="form.category_id"
        >
          <option [ngValue]="undefined">
            No category
          </option>

          <option
            *ngFor="let category of categories"
            [ngValue]="category.id"
          >
            {{ category.name }}
          </option>
        </select>
      </div>

      <div class="form-actions">
        <a class="cancel-button" routerLink="/management/occurrences">Cancel</a>

        <button
          type="submit"
          [disabled]="loading"
        >
          {{ loading ? 'Saving...' : 'Save Occurrence' }}
        </button>
      </div>

    </form>

  </section>

</div>
